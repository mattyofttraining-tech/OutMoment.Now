  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2;\n  --paper-3: #eddfd2;\n  --ink: #3a2d20;\n  --ink-soft: #5b4a38;\n  --muted: #82705d;\n  --faint: #ab9a85;\n  --gold: #a07d2c;\n  --gold-bright: #c79a3a;\n  --gold-soft: rgba(160, 125, 44, 0.10);\n  --lav: #aea2d8;\n  --sky: #99c2e4;\n  --peach: #efae85;\n  --salmon: #e8946a;\n  --brand-grad: linear-gradient(140deg, #aea2d8 0%, #99c2e4 30%, #efb795 68%, #e8946a 100%);\n  --line: rgba(58, 45, 32, 0.13);\n  --white: #fffdf9;\n  --danger: #b3422f;\n  --serif: \"Cormorant Garamond\", Georgia, \"Times New Roman\", serif;\n  --sans: -apple-system, BlinkMacSystemFont, \"SF Pro Text\", \"Segoe UI\", \"Helvetica Neue\", sans-serif;\n  --radius: 26px;\n  --radius-sm: 16px;\n}\n\n* { margin: 0; padding: 0; box-sizing: border-box; }\n\nhtml { scroll-behavior: smooth; }\n\nbody {\n  background: var(--paper);\n  color: var(--ink);\n  font-family: var(--sans);\n  font-size: 17px;\n  line-height: 1.6;\n  -webkit-font-smoothing: antialiased;\n  overflow-x: hidden;\n}\n\nimg { display: block; max-width: 100%; height: auto; }\na { color: inherit; text-decoration: none; }\n::selection { background: rgba(199, 154, 58, 0.3); }\n\n.wrap { width: min(1160px, 92vw); margin: 0 auto; }\n\n/* ---------- type ---------- */\n\n.display {\n  font-family: var(--serif);\n  font-weight: 600;\n  letter-spacing: -0.01em;\n  line-height: 1.04;\n  text-wrap: balance;\n}\n.display em {\n  font-style: italic;\n  background: linear-gradient(110deg, var(--lav) 0%, var(--sky) 32%, var(--salmon) 72%, var(--gold-bright) 100%);\n  -webkit-background-clip: text;\n  background-clip: text;\n  color: transparent;\n  -webkit-text-fill-color: transparent;\n  padding-right: 0.05em;\n}\n\nh2.display { font-size: clamp(40px, 5.4vw, 72px); }\n\n.kicker {\n  display: inline-flex;\n  align-items: center;\n  gap: 12px;\n  font-size: 12.5px;\n  font-weight: 700;\n  letter-spacing: 0.28em;\n  text-transform: uppercase;\n  color: var(--gold);\n}\n.kicker::before, .kicker.center::after {\n  content: \"\";\n  width: 30px; height: 2px;\n  border-radius: 2px;\n  background: linear-gradient(90deg, var(--lav), var(--sky), var(--salmon));\n}\n\n.lede {\n  color: var(--muted);\n  font-size: clamp(17px, 1.6vw, 20px);\n  max-width: 58ch;\n  text-wrap: pretty;\n}\n\n/* ---------- buttons ---------- */\n\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 10px;\n  min-height: 56px;\n  padding: 0 34px;\n  border-radius: 999px;\n  font-family: var(--sans);\n  font-size: 16.5px;\n  font-weight: 650;\n  cursor: pointer;\n  border: none;\n  transition: transform 0.25s cubic-bezier(.2,.8,.3,1), box-shadow 0.25s;\n}\n.btn-ink {\n  background: var(--ink);\n  color: var(--paper);\n  box-shadow: 0 10px 30px rgba(33, 29, 22, 0.22);\n}\n.btn-ink:hover { transform: translateY(-2px); box-shadow: 0 16px 44px rgba(232, 148, 106, 0.5); }\n.btn-line {\n  background: transparent;\n  color: var(--ink);\n  border: 1.5px solid var(--ink);\n}\n.btn-line:hover { transform: translateY(-2px); background: rgba(33,29,22,0.05); }\n\n/* ---------- nav ---------- */\n\n.nav {\n  position: fixed;\n  top: 0; left: 0; right: 0;\n  z-index: 100;\n  padding: 16px 0;\n  transition: background 0.35s, border-color 0.35s, padding 0.35s;\n  border-bottom: 1px solid transparent;\n}\n.nav.scrolled {\n  background: transparent;\n  backdrop-filter: none;\n  -webkit-backdrop-filter: none;\n  border-bottom-color: transparent;\n  padding: 11px 0;\n}\n.nav .btn-ink {\n  background: var(--brand-grad);\n  color: #fffdf9;\n  text-shadow: 0 1px 10px rgba(58, 45, 32, 0.35);\n  box-shadow: 0 8px 26px rgba(174, 162, 216, 0.4);\n}\n.nav .btn-ink:hover { box-shadow: 0 12px 34px rgba(232, 148, 106, 0.55); }\n.nav.scrolled .btn-ink {\n  background: var(--brand-grad);\n  color: #fffdf9;\n  box-shadow: 0 8px 26px rgba(232, 148, 106, 0.4);\n}\n.nav-inner { display: flex; align-items: center; gap: 28px; }\n.nav-logo {\n  display: flex; align-items: center; gap: 11px;\n  font-weight: 750; letter-spacing: 0.18em; font-size: 13.5px;\n}\n.nav-logo img { width: 32px; height: 32px; border-radius: 8px; }\n.nav-links {\n  display: flex; gap: 28px; margin-left: auto;\n  font-size: 15px; font-weight: 600; color: var(--muted);\n}\n.nav-links a { transition: color 0.2s; }\n.nav-links a:hover { color: var(--ink); }\n.nav .btn { min-height: 42px; padding: 0 22px; font-size: 14.5px; }\n@media (max-width: 760px) {\n  .nav-links { display: none; }\n  .nav-inner { justify-content: space-between; gap: 12px; }\n  .nav .btn { margin-left: auto; }\n}\n\n/* ============================================================\n   HERO — floating 3D photo cloud, scroll flies the camera through\n   ============================================================ */\n\n.hero { height: 260vh; position: relative; }\n.hero-stage {\n  position: sticky;\n  top: 0;\n  height: 100svh;\n  overflow: hidden;\n  display: grid;\n  place-items: center;\n  background:\n    radial-gradient(1000px 700px at 78% 14%, rgba(153, 194, 228, 0.38), transparent 62%),\n    radial-gradient(950px 700px at 14% 10%, rgba(174, 162, 216, 0.34), transparent 60%),\n    radial-gradient(1100px 800px at 50% 105%, rgba(232, 148, 106, 0.30), transparent 62%),\n    radial-gradient(700px 500px at 90% 80%, rgba(239, 174, 133, 0.25), transparent 60%),\n    var(--paper);\n}\n.cloud {\n  position: absolute;\n  inset: 0;\n  perspective: 1100px;\n  perspective-origin: 50% 50%;\n  pointer-events: none;\n}\n.cloud-card {\n  position: absolute;\n  top: 50%; left: 50%;\n  border-radius: 12px;\n  overflow: hidden;\n  box-shadow: 0 22px 60px rgba(33, 29, 22, 0.22);\n  will-change: transform, opacity;\n  background: var(--paper-3);\n}\n.cloud-card img { width: 100%; height: 100%; object-fit: cover; }\n.cloud-card::after {\n  content: \"\";\n  position: absolute; inset: 0;\n  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35);\n  border-radius: 12px;\n}\n\n.hero-copy {\n  position: relative;\n  z-index: 5;\n  text-align: center;\n  display: grid;\n  justify-items: center;\n  gap: 20px;\n  margin: 0 4vw;\n  max-width: min(680px, 88vw);\n  padding: clamp(24px, 3.6vw, 44px) clamp(20px, 3.8vw, 52px);\n  background: rgba(250, 246, 239, 0.45);\n  backdrop-filter: blur(16px) saturate(1.15);\n  -webkit-backdrop-filter: blur(16px) saturate(1.15);\n  border: 1px solid rgba(255, 253, 249, 0.6);\n  border-radius: 32px;\n  box-shadow: 0 30px 90px rgba(58, 45, 32, 0.13);\n  will-change: transform, opacity;\n}\n.hero-copy .kicker {\n  background: rgba(255, 253, 249, 0.82);\n  backdrop-filter: blur(12px);\n  -webkit-backdrop-filter: blur(12px);\n  border: 1px solid rgba(160, 125, 44, 0.3);\n  border-radius: 999px;\n  padding: 11px 20px;\n  font-size: 13.5px;\n  color: #8a6a1e;\n  box-shadow: 0 8px 30px rgba(58, 45, 32, 0.12);\n}\n.hero-copy h1 {\n  font-family: var(--serif);\n  font-weight: 600;\n  font-size: clamp(42px, 6.7vw, 99px);\n  line-height: 0.98;\n  letter-spacing: -0.015em;\n}\n.hero-copy h1 em {\n  font-style: italic;\n  font-weight: 700;\n  background: linear-gradient(110deg, var(--lav) 0%, var(--sky) 35%, var(--salmon) 75%, var(--gold-bright) 100%);\n  -webkit-background-clip: text;\n  background-clip: text;\n  color: transparent;\n  padding-right: 0.06em;\n}\n.hero-copy .lede { margin: 0 auto; max-width: 44ch; font-size: clamp(15px, 1.35vw, 17px); }\n.hero-ctas { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }\n.hero-scroll {\n  position: absolute;\n  bottom: 26px; left: 50%;\n  transform: translateX(-50%);\n  z-index: 6;\n  font-size: 11.5px;\n  letter-spacing: 0.3em;\n  text-transform: uppercase;\n  color: var(--faint);\n  display: grid;\n  justify-items: center;\n  gap: 8px;\n}\n.hero-scroll::after {\n  content: \"\";\n  width: 1px; height: 42px;\n  background: linear-gradient(var(--faint), transparent);\n}\n\n/* ============================================================\n   STORY CHAPTERS\n   ============================================================ */\n\n.chapter { padding: clamp(90px, 12vw, 140px) 0; position: relative; overflow: clip; }\n\n/* floating gradient orbs — parallax-driven ambient color */\n.orb {\n  position: absolute;\n  border-radius: 50%;\n  filter: blur(70px);\n  opacity: 0.6;\n  pointer-events: none;\n  will-change: transform;\n  z-index: 0;\n}\n.orb-lav   { background: radial-gradient(circle, rgba(174, 162, 216, 0.85), transparent 70%); }\n.orb-sky   { background: radial-gradient(circle, rgba(153, 194, 228, 0.85), transparent 70%); }\n.orb-peach { background: radial-gradient(circle, rgba(239, 174, 133, 0.85), transparent 70%); }\n.orb-salmon{ background: radial-gradient(circle, rgba(232, 148, 106, 0.75), transparent 70%); }\n.chapter > .wrap { position: relative; z-index: 1; }\n.chapter-num {\n  font-family: var(--serif);\n  font-style: italic;\n  font-size: 20px;\n  color: var(--gold);\n}\n.chapter-head { display: grid; gap: 20px; max-width: 760px; }\n\n/* --- chapter 1: the day --- */\n.ch-day { background: var(--paper); text-align: center; }\n.ch-day .chapter-head { margin: 0 auto; justify-items: center; }\n.day-strip {\n  margin-top: 90px;\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: clamp(18px, 3vw, 44px);\n  align-items: center;\n  perspective: 1200px;\n}\n.day-strip .polaroid {\n  background: #fffdf9;\n  padding: 12px 12px 0;\n  border-radius: 8px;\n  box-shadow: 0 30px 70px rgba(110, 70, 48, 0.35);\n  will-change: transform, opacity;\n  transform-style: preserve-3d;\n  opacity: 0;\n}\n.day-strip .polaroid img {\n  width: 100%;\n  aspect-ratio: 3 / 4;\n  object-fit: cover;\n  border-radius: 4px;\n}\n.day-strip .polaroid figcaption {\n  font-family: var(--serif);\n  font-style: italic;\n  font-size: clamp(15px, 1.5vw, 19px);\n  color: var(--ink-soft);\n  text-align: center;\n  padding: 12px 6px 14px;\n}\nhtml.anim-off .day-strip .polaroid { opacity: 1; }\n@media (max-width: 720px) {\n  /* horizontal swipe strip on mobile — quick to pass, not the main driver */\n  .day-strip {\n    display: flex;\n    overflow-x: auto;\n    gap: 14px;\n    margin-top: 46px;\n    padding: 8px 4px 18px;\n    -webkit-overflow-scrolling: touch;\n    scrollbar-width: none;\n  }\n  .day-strip::-webkit-scrollbar { display: none; }\n  .day-strip .polaroid {\n    flex: 0 0 64vw;\n    opacity: 1;\n  }\n}\n\n/* --- chapter 2: the code --- */\n.ch-code {\n  background:\n    radial-gradient(900px 600px at 88% 8%, rgba(174, 162, 216, 0.30), transparent 60%),\n    radial-gradient(800px 600px at 5% 95%, rgba(239, 174, 133, 0.28), transparent 60%),\n    radial-gradient(700px 500px at 50% 50%, rgba(153, 194, 228, 0.14), transparent 65%),\n    linear-gradient(150deg, #514661 0%, #41506a 35%, #5e4737 70%, #6e4630 100%);\n  color: var(--paper);\n  border-top: 1px solid var(--line);\n  border-bottom: 1px solid var(--line);\n}\n.ch-code .chapter-num { color: var(--gold-bright); }\n.ch-code .lede { color: rgba(250, 246, 239, 0.66); }\n.ch-code .check-item b { color: var(--paper); }\n.ch-code .check-item span { color: rgba(250, 246, 239, 0.58); }\n.ch-code .code-card {\n  box-shadow:\n    0 40px 100px rgba(0, 0, 0, 0.55),\n    0 0 80px rgba(199, 154, 58, 0.2);\n}\n.ch-code .grid2 {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: clamp(40px, 6vw, 90px);\n  align-items: center;\n}\n.code-card {\n  background: linear-gradient(165deg, #261c11 0%, #171108 58%, #231827 100%);\n  border: 1px solid rgba(199, 154, 58, 0.45);\n  border-radius: var(--radius);\n  padding: clamp(34px, 4vw, 54px);\n  text-align: center;\n  display: grid;\n  gap: 18px;\n  justify-items: center;\n  position: relative;\n  color: var(--paper);\n  box-shadow: 0 34px 90px rgba(0, 0, 0, 0.45), 0 0 70px rgba(199, 154, 58, 0.15);\n  transform: rotate(-1.5deg);\n  will-change: transform;\n}\n.code-card::before {\n  content: \"\";\n  position: absolute;\n  inset: 11px;\n  border: 1px solid rgba(199, 154, 58, 0.35);\n  border-radius: calc(var(--radius) - 10px);\n  pointer-events: none;\n}\n.code-card .small {\n  font-size: 12px; letter-spacing: 0.26em; text-transform: uppercase;\n  color: var(--gold-bright); font-weight: 700;\n}\n.code-pill {\n  font-family: var(--sans);\n  font-weight: 800;\n  font-size: clamp(28px, 3.4vw, 42px);\n  letter-spacing: 0.12em;\n  color: #15100a;\n  background: var(--white);\n  border: none;\n  border-radius: 16px;\n  padding: 18px 30px;\n  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45), inset 0 -2px 0 rgba(58, 45, 32, 0.12);\n}\n.code-card p { color: rgba(250, 246, 239, 0.62); font-size: 15px; max-width: 30ch; }\n.check-row { display: grid; gap: 16px; margin-top: 34px; }\n.check-item { display: flex; gap: 14px; align-items: flex-start; }\n.check-item .dot {\n  flex-shrink: 0;\n  width: 26px; height: 26px;\n  border-radius: 50%;\n  color: #fff;\n  display: grid; place-items: center;\n  font-size: 13px; font-weight: 800;\n  margin-top: 2px;\n}\n.check-item:nth-child(1) .dot { background: var(--lav); }\n.check-item:nth-child(2) .dot { background: var(--sky); }\n.check-item:nth-child(3) .dot { background: var(--salmon); }\n.check-item b { display: block; font-size: 16.5px; }\n.check-item span { color: var(--muted); font-size: 15px; }\n@media (max-width: 860px) { .ch-code .grid2 { grid-template-columns: 1fr; } }\n\n/* --- chapter 3: quests --- */\n.ch-quests { background: var(--paper); }\n.quest-fan {\n  margin-top: 64px;\n  display: flex;\n  justify-content: center;\n  gap: clamp(8px, 1.6vw, 22px);\n  flex-wrap: wrap;\n}\n.qcard {\n  border: 1px solid var(--line);\n  border-radius: 20px;\n  width: 200px;\n  padding: 24px 20px 26px;\n  display: grid;\n  gap: 9px;\n  box-shadow: 0 18px 50px rgba(58, 45, 32, 0.12);\n  transition: transform 0.35s cubic-bezier(.2,.8,.3,1), box-shadow 0.35s;\n}\n.qcard:nth-child(5n+1) { background: #f4f0fc; border-color: #ddd3f0; }\n.qcard:nth-child(5n+2) { background: #edf5fc; border-color: #cce1f2; }\n.qcard:nth-child(5n+3) { background: #fdf2e8; border-color: #f2dcc4; }\n.qcard:nth-child(5n+4) { background: #fceee5; border-color: #f1d4bd; }\n.qcard:nth-child(5n+5) { background: #f8f2ec; border-color: #e6d7c7; }\n.qcard:nth-child(odd) { transform: rotate(-2.5deg) translateY(10px); }\n.qcard:nth-child(even) { transform: rotate(2deg) translateY(-6px); }\n.qcard:hover { transform: rotate(0deg) translateY(-10px) scale(1.04); box-shadow: 0 30px 70px rgba(33,29,22,0.18); z-index: 2; }\n.qcard .emo { font-size: 30px; }\n.qcard b { font-size: 16.5px; }\n.qcard span { color: var(--muted); font-size: 13.5px; line-height: 1.45; }\n.qcard .tag {\n  justify-self: start;\n  font-size: 11px; font-weight: 800; letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--gold);\n  background: var(--gold-soft);\n  padding: 4px 10px;\n  border-radius: 999px;\n}\n\n/* --- quest phone demo --- */\n.quests-grid {\n  display: grid;\n  grid-template-columns: 0.8fr 1.2fr;\n  gap: clamp(34px, 5vw, 70px);\n  align-items: center;\n  margin-top: 64px;\n}\n.quests-grid .quest-fan { margin-top: 0; }\n.qphone-scene {\n  display: grid;\n  justify-items: center;\n  gap: 16px;\n  perspective: 1400px;\n}\n.qphone {\n  width: min(264px, 68vw);\n  border-radius: 46px;\n  background: linear-gradient(160deg, #51402d, #2d2316);\n  padding: 11px;\n  box-shadow:\n    0 50px 110px rgba(232, 148, 106, 0.45),\n    inset 0 1px 0 rgba(255, 255, 255, 0.25);\n  will-change: transform;\n  transform-style: preserve-3d;\n}\n.qphone-screen {\n  border-radius: 36px;\n  overflow: hidden;\n  position: relative;\n  background: #000;\n}\n.qphone-screen img { width: 100%; height: auto; }\n.qcam {\n  position: absolute;\n  inset: 0;\n  width: 100% !important;\n  height: 100% !important;\n  object-fit: cover;\n  opacity: 0;\n  will-change: opacity;\n}\n.qlogo {\n  position: absolute;\n  inset: 0;\n  background: var(--brand-grad);\n  display: grid;\n  place-content: center;\n  justify-items: center;\n  gap: 14px;\n  opacity: 0;\n  will-change: opacity;\n}\n.qlogo img {\n  width: 84px !important;\n  height: 84px !important;\n  border-radius: 20px;\n  box-shadow: 0 14px 40px rgba(58, 45, 32, 0.35);\n}\n.qlogo span {\n  font-size: 12px;\n  font-weight: 800;\n  letter-spacing: 0.3em;\n  color: var(--ink);\n}\n.qflash {\n  position: absolute;\n  inset: 0;\n  background: #fff;\n  opacity: 0;\n  pointer-events: none;\n}\n.qtoast {\n  position: absolute;\n  left: 12px; right: 12px; bottom: 14px;\n  background: rgba(255, 253, 249, 0.96);\n  color: var(--ink);\n  border-radius: 999px;\n  font-size: 12.5px;\n  font-weight: 750;\n  text-align: center;\n  padding: 10px 12px;\n  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);\n  opacity: 0;\n  will-change: transform, opacity;\n}\n.qdone {\n  position: absolute;\n  inset: 0;\n  background: rgba(12, 9, 5, 0.66);\n  display: grid;\n  place-content: center;\n  justify-items: center;\n  gap: 8px;\n  text-align: center;\n  color: #fff;\n  opacity: 0;\n  will-change: opacity;\n  padding: 20px;\n}\n.qdone-check {\n  width: 56px; height: 56px;\n  border-radius: 50%;\n  background: linear-gradient(160deg, #f1c93c, #c79a3a);\n  color: #2c2008;\n  display: grid;\n  place-items: center;\n  font-size: 26px;\n  font-weight: 800;\n  box-shadow: 0 10px 34px rgba(199, 154, 58, 0.55);\n  margin-bottom: 6px;\n}\n.qdone b { font-size: 19px; font-weight: 750; }\n.qdone > span:last-child { font-size: 12.5px; color: rgba(255,255,255,0.75); }\n.qphone-hint {\n  font-size: 11.5px;\n  letter-spacing: 0.26em;\n  text-transform: uppercase;\n  color: var(--faint);\n  font-weight: 700;\n}\n@media (max-width: 900px) {\n  .quests-grid { grid-template-columns: 1fr; }\n}\n\n/* --- chapter 4: gallery assembles --- */\n.ch-gallery {\n  background:\n    radial-gradient(900px 600px at 85% 0%, rgba(174, 162, 216, 0.28), transparent 60%),\n    radial-gradient(900px 700px at 10% 100%, rgba(239, 174, 133, 0.26), transparent 60%),\n    radial-gradient(700px 500px at 50% 50%, rgba(153, 194, 228, 0.12), transparent 65%),\n    linear-gradient(210deg, #514661 0%, #41506a 35%, #5e4737 70%, #6e4630 100%);\n  color: var(--paper);\n  padding: 160px 0;\n  overflow: clip;\n}\n.ch-gallery .kicker { color: var(--gold-bright); }\n.ch-gallery .kicker::before { background: var(--gold-bright); }\n.ch-gallery .lede { color: rgba(250, 246, 239, 0.62); }\n.gal-grid {\n  margin-top: 70px;\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 14px;\n}\n.gal-grid figure {\n  border-radius: 14px;\n  overflow: hidden;\n  aspect-ratio: 4/5;\n  will-change: transform, opacity;\n  position: relative;\n}\n.gal-grid img { width: 100%; height: 100%; object-fit: cover; }\n.gal-grid figcaption {\n  position: absolute;\n  bottom: 10px; left: 12px;\n  font-size: 12.5px;\n  font-weight: 650;\n  color: #fff;\n  text-shadow: 0 1px 10px rgba(0,0,0,0.6);\n  opacity: 0.85;\n}\n@media (max-width: 720px) { .gal-grid { grid-template-columns: repeat(2, 1fr); } }\n\n/* --- chapter 5: save or lose --- */\n.ch-vanish { background: var(--paper); padding: 160px 0; }\n.ch-vanish .chapter-head { margin: 0 auto; justify-items: center; text-align: center; }\n.countdown { display: flex; gap: clamp(10px, 2vw, 20px); justify-content: center; margin-top: 44px; }\n.cd-cell {\n  background: var(--white);\n  border: 1px solid var(--line);\n  border-top: 3px solid var(--lav);\n  border-radius: var(--radius-sm);\n  min-width: clamp(70px, 9vw, 118px);\n  padding: 18px 10px 13px;\n  text-align: center;\n  box-shadow: 0 14px 40px rgba(174, 162, 216, 0.22);\n}\n.cd-cell:nth-child(2) { border-top-color: var(--sky); box-shadow: 0 14px 40px rgba(153, 194, 228, 0.25); }\n.cd-cell:nth-child(3) { border-top-color: var(--peach); box-shadow: 0 14px 40px rgba(239, 174, 133, 0.28); }\n.cd-cell:nth-child(4) { border-top-color: var(--salmon); box-shadow: 0 14px 40px rgba(232, 148, 106, 0.28); }\n.cd-cell b {\n  display: block;\n  font-family: var(--serif);\n  font-size: clamp(36px, 4.6vw, 60px);\n  font-weight: 600;\n  line-height: 1;\n  font-variant-numeric: tabular-nums;\n}\n.cd-cell span {\n  font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase;\n  color: var(--faint); font-weight: 700;\n}\n.cd-note { text-align: center; color: var(--muted); font-size: 15px; margin-top: 18px; }\n.cd-note b { color: var(--gold); }\n\n.vanish-row {\n  margin-top: 64px;\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 16px;\n}\n.vanish-tile {\n  position: relative;\n  border-radius: var(--radius-sm);\n  overflow: hidden;\n  aspect-ratio: 4/5;\n  box-shadow: 0 18px 50px rgba(33,29,22,0.12);\n}\n.vanish-tile img { width: 100%; height: 100%; object-fit: cover; will-change: filter, opacity; }\n.vanish-tile .badge {\n  position: absolute;\n  top: 12px; left: 12px;\n  background: rgba(255, 253, 249, 0.9);\n  border-radius: 999px;\n  font-size: 12px;\n  font-weight: 750;\n  padding: 6px 13px;\n  color: var(--muted);\n  backdrop-filter: blur(6px);\n}\n.vanish-tile.saved { box-shadow: 0 0 0 2px var(--gold), 0 22px 60px rgba(160, 125, 44, 0.3); }\n.vanish-tile.saved .badge { background: var(--gold); color: var(--white); }\n@media (max-width: 720px) { .vanish-row { grid-template-columns: repeat(2, 1fr); } }\n\n/* ============================================================\n   PRICING + CTA\n   ============================================================ */\n\n.pricing {\n  background:\n    radial-gradient(1000px 700px at 12% 10%, rgba(174, 162, 216, 0.20), transparent 60%),\n    radial-gradient(900px 700px at 92% 90%, rgba(153, 194, 228, 0.20), transparent 60%),\n    var(--paper-2);\n  border-top: 1px solid var(--line);\n  padding: 150px 0 120px;\n  position: relative;\n  overflow: clip;\n}\n.pricing > .wrap { position: relative; z-index: 1; }\n.pricing .chapter-head { margin: 0 auto; justify-items: center; text-align: center; }\n.price-anchor {\n  font-family: var(--serif);\n  font-size: clamp(64px, 9vw, 132px);\n  font-weight: 600;\n  line-height: 1;\n  color: var(--ink);\n}\n.price-anchor sup { font-size: 0.35em; color: var(--gold); font-style: italic; vertical-align: super; }\n.price-sub { color: var(--muted); font-size: 16px; }\n.occasions {\n  margin-top: 70px;\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 16px;\n}\n.occ {\n  position: relative;\n  border-radius: var(--radius-sm);\n  overflow: hidden;\n  aspect-ratio: 3/4;\n  box-shadow: 0 24px 60px rgba(232, 148, 106, 0.3);\n  transition: transform 0.35s cubic-bezier(.2,.8,.3,1), box-shadow 0.35s;\n  will-change: transform;\n}\n.occ:hover { box-shadow: 0 40px 90px rgba(174, 162, 216, 0.45); }\n.occ img { width: 100%; height: 100%; object-fit: cover; }\n.occ .scrim {\n  position: absolute; inset: 0;\n  background: linear-gradient(180deg, transparent 40%, rgba(20, 16, 10, 0.78));\n}\n.occ .occ-label {\n  position: absolute;\n  left: 18px; right: 18px; bottom: 16px;\n  color: #fff;\n  display: grid;\n  gap: 2px;\n}\n.occ .occ-label b { font-family: var(--serif); font-size: 26px; font-weight: 600; }\n.occ .occ-label span { font-size: 13.5px; opacity: 0.85; }\n.occ .from {\n  position: absolute;\n  top: 12px; right: 12px;\n  background: rgba(255, 253, 249, 0.92);\n  color: var(--ink);\n  font-size: 12.5px;\n  font-weight: 750;\n  border-radius: 999px;\n  padding: 6px 13px;\n}\n@media (max-width: 860px) { .occasions { grid-template-columns: repeat(2, 1fr); } }\n\n/* --- waitlist CTA --- */\n.cta { background: var(--paper-2); padding: 40px 0 150px; }\n.cta-card {\n  background: var(--brand-grad);\n  color: var(--ink);\n  border-radius: var(--radius);\n  padding: clamp(50px, 7vw, 96px) clamp(24px, 6vw, 80px);\n  text-align: center;\n  display: grid;\n  justify-items: center;\n  gap: 24px;\n  position: relative;\n  overflow: hidden;\n  box-shadow: 0 40px 100px rgba(232, 148, 106, 0.35);\n}\n.cta-card::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background:\n    radial-gradient(700px 400px at 50% -15%, rgba(255, 255, 255, 0.35), transparent 65%),\n    radial-gradient(600px 400px at 50% 115%, rgba(58, 45, 32, 0.12), transparent 65%);\n  pointer-events: none;\n}\n.cta-card > * { position: relative; }\n.cta-card .kicker { color: var(--ink); }\n.cta-card .kicker::before { background: var(--ink); }\n.cta-card .display em {\n  background: none;\n  -webkit-background-clip: initial;\n  background-clip: initial;\n  color: var(--white);\n  -webkit-text-fill-color: var(--white);\n  text-shadow: 0 2px 24px rgba(58, 45, 32, 0.25);\n}\n.cta-card .lede { color: rgba(58, 45, 32, 0.78); margin: 0 auto; }\n.waitlist-form { display: flex; gap: 12px; width: min(560px, 100%); margin-top: 6px; }\n.waitlist-form input {\n  flex: 1;\n  min-height: 56px;\n  border-radius: 999px;\n  border: 1px solid rgba(58, 45, 32, 0.25);\n  background: rgba(255, 253, 249, 0.65);\n  color: var(--ink);\n  font-family: var(--sans);\n  font-size: 16.5px;\n  padding: 0 24px;\n  outline: none;\n  transition: border-color 0.25s, background 0.25s;\n}\n.waitlist-form input::placeholder { color: rgba(58, 45, 32, 0.45); }\n.waitlist-form input:focus { border-color: var(--ink); background: rgba(255, 253, 249, 0.9); }\n.waitlist-form .btn { background: var(--ink); color: var(--paper); }\n.waitlist-form .btn:hover { box-shadow: 0 14px 40px rgba(58, 45, 32, 0.35); }\n.waitlist-msg { font-size: 15px; color: var(--ink); min-height: 22px; font-weight: 650; }\n.waitlist-sub { font-size: 13.5px; color: rgba(58, 45, 32, 0.6); max-width: 52ch; }\n.waitlist-sub a { color: var(--ink); font-weight: 700; text-decoration: underline; }\n@media (max-width: 560px) { .waitlist-form { flex-direction: column; } }\n\n/* ---------- footer ---------- */\n\nfooter {\n  background: var(--paper);\n  border-top: none;\n  padding: 64px 0 90px;\n  position: relative;\n}\nfooter::before {\n  content: \"\";\n  position: absolute;\n  top: 0; left: 0; right: 0;\n  height: 3px;\n  background: var(--brand-grad);\n}\n.foot-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 40px; }\n.foot-brand { display: grid; gap: 16px; align-content: start; }\n.foot-brand img { width: 42px; height: 42px; border-radius: 10px; }\n.foot-brand p { color: var(--muted); font-size: 15px; max-width: 34ch; }\n.foot-col h4 {\n  font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase;\n  color: var(--faint); margin-bottom: 16px;\n}\n.foot-col ul { list-style: none; display: grid; gap: 10px; font-size: 15px; color: var(--muted); }\n.foot-col a:hover { color: var(--ink); }\n.foot-legal {\n  margin-top: 56px; padding-top: 24px;\n  border-top: 1px solid var(--line);\n  display: flex; flex-wrap: wrap; gap: 8px 28px;\n  font-size: 13.5px; color: var(--faint);\n}\n@media (max-width: 760px) { .foot-grid { grid-template-columns: 1fr; } }\n\n/* ---------- cookie bar ---------- */\n\n.cookie-bar {\n  position: fixed;\n  left: 50%; bottom: 22px;\n  transform: translateX(-50%) translateY(140%);\n  width: min(660px, 94vw);\n  background: rgba(255, 253, 249, 0.95);\n  backdrop-filter: blur(16px);\n  border: 1px solid var(--line);\n  border-radius: 20px;\n  padding: 16px 20px;\n  display: flex;\n  gap: 18px;\n  align-items: center;\n  z-index: 200;\n  transition: transform 0.5s cubic-bezier(.2,.8,.3,1);\n  box-shadow: 0 24px 70px rgba(33, 29, 22, 0.2);\n}\n.cookie-bar.show { transform: translateX(-50%) translateY(0); }\n.cookie-bar p { font-size: 14px; color: var(--muted); flex: 1; }\n.cookie-bar p a { color: var(--gold); font-weight: 650; }\n.cookie-bar .btn { min-height: 42px; padding: 0 20px; font-size: 14.5px; flex-shrink: 0; }\n@media (max-width: 560px) { .cookie-bar { flex-direction: column; align-items: stretch; text-align: center; } }\n\n/* ---------- reveal ---------- */\n\n.reveal { opacity: 0; transform: translateY(34px); transition: opacity 0.85s ease, transform 0.85s cubic-bezier(.2,.8,.3,1); }\n.reveal.in { opacity: 1; transform: none; }\n.reveal.d1 { transition-delay: 0.08s; }\n.reveal.d2 { transition-delay: 0.16s; }\n.reveal.d3 { transition-delay: 0.24s; }\n@media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } }\nhtml.anim-off .reveal { transition: none !important; opacity: 1 !important; transform: none !important; }\nhtml.anim-off .vanish-tile img { transition: none !important; }\n\n/* ---------- phone scale ---------- */\n@media (max-width: 640px) {\n  body { font-size: 16px; }\n  .hero { height: 220vh; }\n  /* mobile-only frosted glass behind hero copy for readability over the 3D cloud */\n  .hero-copy {\n    gap: 18px;\n    margin: 0 5vw;\n    padding: 26px 18px;\n    background: rgba(250, 246, 239, 0.72);\n    backdrop-filter: blur(14px) saturate(1.15);\n    -webkit-backdrop-filter: blur(14px) saturate(1.15);\n    border: 1px solid rgba(255, 253, 249, 0.65);\n    border-radius: 26px;\n    box-shadow: 0 24px 70px rgba(58, 45, 32, 0.16);\n  }\n  .hero-copy .lede { font-size: 16px; }\n  .btn { min-height: 50px; padding: 0 24px; font-size: 15.5px; }\n  .nav .btn { padding: 0 16px; font-size: 13.5px; }\n  .nav-logo span { letter-spacing: 0.12em; font-size: 12px; }\n  .quest-fan { gap: 12px; }\n  .qcard { width: calc(50% - 6px); padding: 18px 15px 20px; }\n  .qcard:nth-child(odd), .qcard:nth-child(even) { transform: none; }\n  .countdown { flex-wrap: wrap; }\n  .cd-cell { min-width: calc(25% - 8px); padding: 12px 6px 9px; }\n  .day-strip { gap: 14px; }\n  .gal-grid { gap: 9px; margin-top: 46px; }\n  .vanish-row { gap: 10px; margin-top: 44px; }\n  .occasions { gap: 10px; margin-top: 46px; }\n  .occ .occ-label b { font-size: 21px; }\n  .occ .occ-label span { font-size: 12px; }\n  .code-card { transform: rotate(0deg); }\n  .cta-card { border-radius: 22px; }\n  .foot-legal { font-size: 12.5px; }\n  .orb { filter: blur(50px); opacity: 0.5; }\n}\n<\u002Fstyle>\n<style>\n  .doc { padding: 150px 0 110px; }\n  .doc-head { display: grid; gap: 18px; margin-bottom: 26px; }\n  .doc-head h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(40px, 5.4vw, 64px); line-height: 1.02; }\n  .doc-head h1 em { font-style: italic; color: var(--gold); }\n  .doc-meta { color: var(--faint); font-size: 14.5px; }\n  .doc-toc { display: flex; flex-wrap: wrap; gap: 10px; margin: 26px 0 56px; }\n  .doc-toc a {\n    background: var(--white); border: 1px solid var(--line);\n    border-radius: 999px; padding: 9px 18px;\n    font-size: 14.5px; font-weight: 600; color: var(--muted);\n    transition: border-color 0.2s, color 0.2s, transform 0.2s;\n  }\n  .doc-toc a:hover { border-color: var(--gold); color: var(--ink); transform: translateY(-2px); }\n  .doc article {\n    background: var(--white); border: 1px solid var(--line);\n    border-radius: var(--radius); padding: clamp(28px, 4vw, 52px);\n    margin-bottom: 28px; scroll-margin-top: 110px;\n    box-shadow: 0 18px 50px rgba(58, 45, 32, 0.06);\n  }\n  .doc article > .kicker { margin-bottom: 14px; }\n  .doc h2 { font-family: var(--serif); font-weight: 600; font-size: clamp(28px, 3.2vw, 40px); margin-bottom: 18px; }\n  .doc h3 { font-size: 18.5px; margin: 30px 0 10px; }\n  .doc p, .doc li { color: var(--ink-soft); font-size: 15.5px; }\n  .doc p { margin-bottom: 12px; text-wrap: pretty; }\n  .doc ul, .doc ol { padding-left: 22px; display: grid; gap: 8px; margin: 10px 0 14px; }\n  .doc strong { color: var(--ink); }\n  .doc a { color: var(--gold); font-weight: 650; }\n  .doc table { width: 100%; border-collapse: collapse; margin: 14px 0 18px; font-size: 14.5px; color: var(--ink-soft); }\n  .doc th, .doc td { text-align: left; padding: 11px 14px; border: 1px solid var(--line); vertical-align: top; }\n  .doc th { color: var(--ink); font-size: 12.5px; letter-spacing: 0.08em; text-transform: uppercase; background: var(--paper-2); }\n  .doc .note {\n    border: 1px solid rgba(160, 125, 44, 0.4); background: var(--gold-soft);\n    border-radius: var(--radius-sm); padding: 16px 20px; margin: 16px 0;\n  }\n  .doc .note p { margin: 0; color: var(--ink); }\n  .doc-foot { text-align: center; color: var(--faint); font-size: 14px; padding-bottom: 50px; }\n  body.legal {\n    background:\n      radial-gradient(1100px 600px at 85% -5%, rgba(153, 194, 228, 0.22), transparent 60%),\n      radial-gradient(1000px 600px at 0% 12%, rgba(174, 162, 216, 0.18), transparent 55%),\n      radial-gradient(900px 700px at 70% 110%, rgba(239, 174, 133, 0.18), transparent 60%),\n      var(--paper);\n    background-attachment: fixed;\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body class=\"legal\">\n\n\n\n<nav class=\"nav scrolled\">\n  <div class=\"wrap nav-inner\">\n    <a class=\"nav-logo\" href=\"OurMoment.html\">\n      <img src=\"49e7ab22-3872-4f75-b117-1c9a83c3570f\" alt=\"OurMoment icon\" width=\"96\" height=\"96\">\n      <span>OURMOMENT<\u002Fspan>\n    <\u002Fa>\n    <div class=\"nav-links\">\n      <a href=\"OurMoment.html#story\">The story<\u002Fa>\n      <a href=\"OurMoment.html#quests\">Photo quests<\u002Fa>\n      <a href=\"OurMoment.html#vanish\">Why 30 days<\u002Fa>\n      <a href=\"OurMoment.html#pricing\">Pricing<\u002Fa>\n    <\u002Fdiv>\n    <a class=\"btn btn-ink\" href=\"OurMoment.html#waitlist\">Get early access<\u002Fa>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<main class=\"doc\" data-screen-label=\"Legal\">\n  <div class=\"wrap\" style=\"max-width: 880px;\">\n\n    <div class=\"doc-head\">\n      <span class=\"kicker\">Company &amp; Legal<\u002Fspan>\n      <h1>About <em>OurMoment<\u002Fem><\u002Fh1>\n      <p class=\"lede\">Who we are, how we handle your data, and your rights as a user — in plain language.<\u002Fp>\n      <p class=\"doc-meta\">Last updated: 10 June 2026<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"doc-toc\">\n      <a href=\"#company\">Company information<\u002Fa>\n      <a href=\"#privacy\">Privacy Policy<\u002Fa>\n      <a href=\"#cookies\">Cookie Policy<\u002Fa>\n      <a href=\"#terms\">Terms of Service<\u002Fa>\n      <a href=\"#refunds\">Refunds &amp; Right of Withdrawal<\u002Fa>\n    <\u002Fdiv>\n\n    <!-- ============ COMPANY ============ -->\n    <article id=\"company\">\n      <span class=\"kicker\">E-handelsloven §8<\u002Fspan>\n      <h2>Company Information<\u002Fh2>\n      <p>OurMoment is developed and operated by:<\u002Fp>\n      <table>\n        <tbody>\n          <tr><th>Legal name<\u002Fth><td>Min Virksomhed v.Mathias Sørsdal<\u002Ftd><\u002Ftr>\n          <tr><th>CVR number<\u002Fth><td>44426293<\u002Ftd><\u002Ftr>\n          <tr><th>Registered address<\u002Fth><td>Kastet 86, 7700 Thisted, Denmark<\u002Ftd><\u002Ftr>\n          <tr><th>Email<\u002Fth><td><a href=\"mailto:mattyofttraining@gmail.com\">mattyofttraining@gmail.com<\u002Fa><\u002Ftd><\u002Ftr>\n          <tr><th>Country of establishment<\u002Fth><td>Denmark<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n      <p>We are registered with the Danish Business Authority (Erhvervsstyrelsen). You can verify our registration at <a href=\"https://www.virk.dk\" rel=\"noopener\">virk.dk<\u002Fa>.<\u002Fp>\n      <p><strong>Contact us:<\u002Fstrong> for any questions, support requests, or legal notices, please email <a href=\"mailto:mattyofttraining@gmail.com\">mattyofttraining@gmail.com<\u002Fa>. We aim to respond within 5 business days.<\u002Fp>\n    <\u002Farticle>\n\n    <!-- ============ PRIVACY ============ -->\n    <article id=\"privacy\">\n      <span class=\"kicker\">GDPR / Databeskyttelsesloven<\u002Fspan>\n      <h2>Privacy Policy<\u002Fh2>\n      <p>Min Virksomhed v.Mathias Sørsdal (“we”, “us”) is the data controller for personal data processed through the OurMoment app and this website, within the meaning of Regulation (EU) 2016/679 (GDPR) and the Danish Data Protection Act (Databeskyttelsesloven).<\u002Fp>\n\n      <h3>Privacy by design: the 30-day wipe<\u002Fh3>\n      <p>OurMoment is built around automatic deletion. <strong>Every event — including all photos uploaded to it — is permanently and irreversibly deleted from our servers 30 days after the event is created.<\u002Fstrong> Only photos a user has explicitly saved to their personal Saved shelf are retained beyond that point. This deletion-by-default architecture is our principal data-minimisation measure under GDPR Art. 5(1)(c) and Art. 25.<\u002Fp>\n\n      <h3>Data we collect<\u002Fh3>\n      <table>\n        <thead><tr><th>Category<\u002Fth><th>Examples<\u002Fth><th>Legal basis (GDPR Art. 6)<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td>Event &amp; profile data<\u002Ftd><td>Event name, occasion type, display name you choose, invite-code membership<\u002Ftd><td>Art. 6(1)(b) — contract performance<\u002Ftd><\u002Ftr>\n          <tr><td>Photos<\u002Ftd><td>Photos captured into an event’s shared gallery, and photos you save to your private Saved shelf<\u002Ftd><td>Art. 6(1)(b) — contract performance; uploaders confirm they have the right to share the content<\u002Ftd><\u002Ftr>\n          <tr><td>Waitlist data<\u002Ftd><td>Email address submitted on this website<\u002Ftd><td>Art. 6(1)(a) — consent (withdraw any time by unsubscribing)<\u002Ftd><\u002Ftr>\n          <tr><td>Purchase data<\u002Ftd><td>Purchased event tier and purchase date. Payment card details are processed directly by Apple, Google, or Stripe and never stored by us<\u002Ftd><td>Art. 6(1)(b) — contract performance<\u002Ftd><\u002Ftr>\n          <tr><td>Device &amp; stability data<\u002Ftd><td>OS version, device model, push token, crash reports and error logs<\u002Ftd><td>Art. 6(1)(f) — legitimate interest (stability, security)<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n\n      <h3>Photos of other people<\u002Fh3>\n      <p>Event photos naturally depict guests and other attendees. The host and each contributing guest are responsible for ensuring that people photographed at their private event are aware photos are being shared within the closed event group. OurMoment provides the private infrastructure; <strong>we do not review, curate, or publish event content, and the responsibility for the lawfulness of captured content rests with the person who uploads it.<\u002Fstrong> If you believe a photo of you is being processed unlawfully, contact us and we will assist — noting that all unsaved event content is in any case automatically erased at the 30-day mark.<\u002Fp>\n\n      <h3>How we use your data<\u002Fh3>\n      <ul>\n        <li>To create and operate private events and deliver photos to event members.<\u002Fli>\n        <li>To process and verify event purchases.<\u002Fli>\n        <li>To notify you about launch (waitlist) or about events you belong to (e.g. expiry reminders).<\u002Fli>\n        <li>To diagnose crashes and improve app performance.<\u002Fli>\n        <li>To comply with our legal obligations.<\u002Fli>\n      <\u002Ful>\n      <p>We do <strong>not<\u002Fstrong> sell personal data, show advertising, share data with ad networks, or use your photos to train AI models.<\u002Fp>\n\n      <h3>Data retention<\u002Fh3>\n      <ul>\n        <li><strong>Event galleries:<\u002Fstrong> deleted permanently 30 days after event creation. Deletion is irreversible; we keep no backups of expired event content beyond a short technical rollover window (max. 14 days) used solely for disaster recovery.<\u002Fli>\n        <li><strong>Saved photos:<\u002Fstrong> retained while your account exists, until you delete them or your account.<\u002Fli>\n        <li><strong>Waitlist emails:<\u002Fstrong> retained until launch communication is complete or you unsubscribe, whichever is first.<\u002Fli>\n        <li><strong>Purchase records:<\u002Fstrong> up to 5 years, as required by the Danish Bookkeeping Act (Bogføringsloven).<\u002Fli>\n      <\u002Ful>\n\n      <h3>Data processors and international transfers<\u002Fh3>\n      <p>We use a small number of third-party processors (cloud hosting, authentication, crash reporting, and payment processing — e.g. Google Firebase, Apple, Google Play, Stripe). All processors are contractually bound to process data only on our instructions. Where data is processed outside the EU/EEA, transfers are safeguarded by Standard Contractual Clauses (SCCs).<\u002Fp>\n\n      <h3>Your rights under GDPR<\u002Fh3>\n      <ul>\n        <li><strong>Access (Art. 15)<\u002Fstrong> — request a copy of the personal data we hold about you.<\u002Fli>\n        <li><strong>Rectification (Art. 16)<\u002Fstrong> — correct inaccurate data.<\u002Fli>\n        <li><strong>Erasure (Art. 17)<\u002Fstrong> — request deletion. Note that the 30-day wipe already erases event content automatically.<\u002Fli>\n        <li><strong>Restriction (Art. 18)<\u002Fstrong> and <strong>objection (Art. 21)<\u002Fstrong>.<\u002Fli>\n        <li><strong>Portability (Art. 20)<\u002Fstrong> — your Saved shelf can be exported in one tap from the app.<\u002Fli>\n        <li><strong>Withdraw consent<\u002Fstrong> at any time, without affecting prior lawful processing.<\u002Fli>\n      <\u002Ful>\n      <p>To exercise any right, email <a href=\"mailto:mattyofttraining@gmail.com\">mattyofttraining@gmail.com<\u002Fa>. We respond within one month (extendable by two further months in complex cases). You may also lodge a complaint with the Danish Data Protection Authority (Datatilsynet) at <a href=\"https://www.datatilsynet.dk\" rel=\"noopener\">datatilsynet.dk<\u002Fa>.<\u002Fp>\n      <div class=\"note\"><p><strong>One practical consequence of privacy by design:<\u002Fstrong> once the 30-day wipe has run, expired photos cannot be recovered by us or anyone else — for any reason, including accidental failure to save. Please save what you love in time.<\u002Fp><\u002Fdiv>\n    <\u002Farticle>\n\n    <!-- ============ COOKIES ============ -->\n    <article id=\"cookies\">\n      <span class=\"kicker\">Cookieloven (ePrivacy)<\u002Fspan>\n      <h2>Cookie Policy<\u002Fh2>\n      <p>This website uses no tracking cookies and no third-party advertising or analytics cookies. In accordance with the Danish Cookie Act (Cookieloven, implementing EU Directive 2009/136/EC), the table below lists everything we store in your browser.<\u002Fp>\n      <h3>Strictly necessary local storage<\u002Fh3>\n      <p>These entries are essential for the site to function and do not require prior consent under Danish law:<\u002Fp>\n      <table>\n        <thead><tr><th>Name<\u002Fth><th>Purpose<\u002Fth><th>Duration<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td><code>om_cookie_ok<\u002Fcode><\u002Ftd><td>Remembers that you have dismissed the cookie notice<\u002Ftd><td>Persistent (until you clear browser data)<\u002Ftd><\u002Ftr>\n          <tr><td><code>om_waitlist<\u002Fcode><\u002Ftd><td>Locally records your waitlist signup so the form remembers you<\u002Ftd><td>Persistent (until you clear browser data)<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n      <h3>Analytics<\u002Fh3>\n      <p>No third-party analytics service is currently active on this site. If one is introduced, this policy will be updated and we will implement a consent mechanism before any non-essential cookies are set.<\u002Fp>\n      <h3>Managing cookies<\u002Fh3>\n      <p>You can control or delete stored data at any time through your browser settings. See <a href=\"https://www.aboutcookies.org\" rel=\"noopener\">aboutcookies.org<\u002Fa> for instructions.<\u002Fp>\n    <\u002Farticle>\n\n    <!-- ============ TERMS ============ -->\n    <article id=\"terms\">\n      <span class=\"kicker\">Handelsbetingelser<\u002Fspan>\n      <h2>Terms of Service<\u002Fh2>\n\n      <h3>1. Acceptance<\u002Fh3>\n      <p>By using the OurMoment app or website, you agree to these Terms of Service. If you do not agree, please do not use the service. These terms are governed by Danish law, and any disputes shall be subject to the exclusive jurisdiction of the Danish courts.<\u002Fp>\n\n      <h3>2. The service<\u002Fh3>\n      <p>OurMoment is a private event photo-sharing application developed and operated by Min Virksomhed v.Mathias Sørsdal (CVR 44426293), Kastet 86, 7700 Thisted, Denmark.<\u002Fp>\n      <p>A <strong>host<\u002Fstrong> purchases an event as a one-time purchase, selects an occasion and guest tier, and receives a private invite code. <strong>Guests<\u002Fstrong> join free of charge with that code. All members of an event can contribute photos to, and view, the event’s shared gallery. Each member may save photos to their personal Saved shelf. <strong>30 days after the event is created, the event and all unsaved photos in it are permanently deleted.<\u002Fstrong> Tier names, prices, and inclusions are shown in the app at the time of purchase.<\u002Fp>\n\n      <h3>3. The 30-day deletion — acknowledged and accepted<\u002Fh3>\n      <p>Automatic, irreversible deletion at 30 days is a core, advertised feature of the service — not a defect. By using OurMoment you acknowledge and accept that:<\u002Fp>\n      <ul>\n        <li>any photo not saved before the event expires will be permanently lost;<\u002Fli>\n        <li>we have no obligation — and after deletion, no technical ability — to recover expired content;<\u002Fli>\n        <li>we are not liable for any loss, damage, or distress arising from the deletion of unsaved content at expiry, regardless of the reason a photo was not saved.<\u002Fli>\n      <\u002Ful>\n      <p>The app surfaces the expiry date prominently and sends reminders, but <strong>saving in time remains solely your responsibility.<\u002Fstrong><\u002Fp>\n\n      <h3>4. Accounts and event codes<\u002Fh3>\n      <p>You are responsible for activity under your device and profile, and hosts are responsible for who they share their invite code with. A code unlocks one private event for anyone who has it; treat it like a key. We may regenerate codes or restrict access where we reasonably suspect abuse.<\u002Fp>\n\n      <h3>5. Purchases<\u002Fh3>\n      <p>Event purchases are one-time purchases billed by Apple App Store, Google Play, or Stripe (web). We never process or store payment card data ourselves. Purchased tiers apply to a single event and are not transferable between events once the event has been created and its code issued.<\u002Fp>\n\n      <h3>6. User content and conduct<\u002Fh3>\n      <p>You retain ownership of the photos you capture. By uploading to an event you grant us a limited, non-exclusive licence to host, process, and deliver that content to event members — solely to operate the service, and automatically expiring when the content is deleted. You warrant that you have the right to share what you upload. You may not upload unlawful content, content infringing others’ rights, or content depicting persons who have objected to being photographed. We may remove content and suspend access at our reasonable discretion, with or without prior notice, where we suspect a violation of these terms or applicable law.<\u002Fp>\n      <p>You may not reverse engineer, decompile, or disassemble any part of the app, attempt unauthorised access to the service, or resell access to events.<\u002Fp>\n\n      <h3>7. Availability and changes<\u002Fh3>\n      <p>We aim to keep OurMoment available throughout your event but do not guarantee uninterrupted service. The service is provided <strong>“as is” and “as available”.<\u002Fstrong> We may update, modify, or discontinue features at any time; material changes affecting a purchased, not-yet-expired event will be communicated where reasonably practicable.<\u002Fp>\n\n      <h3>8. Limitation of liability<\u002Fh3>\n      <p>To the fullest extent permitted by Danish law, we are not liable for indirect, incidental, or consequential damages — including loss of photos, memories, or emotional value — arising from use of, or inability to use, the service. <strong>Our total aggregate liability to you shall not exceed the amount you paid us for the event giving rise to the claim.<\u002Fstrong> For guests who paid nothing, our liability is limited to DKK 0 to the fullest extent the law allows. Nothing in these terms limits liability that cannot be limited under mandatory law, including liability for death or personal injury caused by negligence, or for fraud.<\u002Fp>\n\n      <h3>9. Photography at events<\u002Fh3>\n      <p>Hosts are responsible for informing attendees that photos taken at their event are shared within the closed event group, and for complying with any local rules applicable to their venue. OurMoment acts as a technical intermediary and assumes no responsibility for disputes between hosts, guests, or third parties concerning captured content.<\u002Fp>\n\n      <h3>10. Termination<\u002Fh3>\n      <p>You may leave an event or delete your profile at any time in the app. We reserve the right to suspend or terminate access for accounts that violate these terms, with notice where reasonably practicable. Expiry of an event under the 30-day rule is not a termination of service and gives rise to no claim.<\u002Fp>\n    <\u002Farticle>\n\n    <!-- ============ REFUNDS ============ -->\n    <article id=\"refunds\">\n      <span class=\"kicker\">Forbrugeraftaleloven §18<\u002Fspan>\n      <h2>Refunds &amp; Right of Withdrawal<\u002Fh2>\n      <p>As a consumer resident in the EU or Denmark, you have the right to withdraw from the purchase of an OurMoment event within <strong>14 calendar days<\u002Fstrong> of purchase, without giving any reason, in accordance with the Danish Consumer Contracts Act (Forbrugeraftaleloven) and EU Directive 2011/83/EU.<\u002Fp>\n\n      <h3>Waiver of withdrawal for delivered digital services<\u002Fh3>\n      <p>When you purchase an event, we ask for your explicit consent to begin providing the digital service immediately (stated at checkout). <strong>Once your event has been created and its invite code issued — and in any case once the first photo has been captured into the event — performance of the service has begun, and you acknowledge that you lose your right of withdrawal<\u002Fstrong>, in accordance with Forbrugeraftaleloven §18(3) and EU Directive 2011/83/EU Art. 16(m). An event slot is reserved infrastructure dedicated to your date; it cannot be “returned” once activated.<\u002Fp>\n\n      <h3>If you have not yet used the event<\u002Fh3>\n      <p>If you purchased an event but have not yet created it (no code issued, no photos captured), you may request a refund within 14 days by emailing <a href=\"mailto:mattyofttraining@gmail.com\">mattyofttraining@gmail.com<\u002Fa> with the subject line <em>“Withdrawal — OurMoment”<\u002Fem>, including:<\u002Fp>\n      <ul>\n        <li>your full name and the email or profile name used in OurMoment;<\u002Fli>\n        <li>your purchase date and platform (App Store, Google Play, or Web/Stripe);<\u002Fli>\n        <li>a clear statement that you wish to withdraw from the purchase.<\u002Fli>\n      <\u002Ful>\n      <p>Refunds for App Store purchases are processed by Apple, and Google Play purchases by Google, under their respective policies. For purchases made directly via Stripe, we refund the original payment method within 14 days of a valid withdrawal notice.<\u002Fp>\n\n      <h3>No refund for expired events<\u002Fh3>\n      <p>The 30-day lifecycle is an advertised characteristic of the product. Expiry of an event, deletion of unsaved photos, lower-than-expected guest participation, or dissatisfaction with photos contributed by guests do not constitute defects and do not give rise to a refund. This does not affect your statutory rights in the event of an actual defect in the service.<\u002Fp>\n    <\u002Farticle>\n\n  <\u002Fdiv>\n<\u002Fmain>\n\n<div class=\"doc-foot wrap\">\n  <p>© 2026 OurMoment · Min Virksomhed v.Mathias Sørsdal · CVR 44426293 · Kastet 86, 7700 Thisted, Denmark<\u002Fp>\n  <p style=\"margin-top: 6px;\"><a href=\"OurMoment.html\" style=\"color: var(--gold); font-weight: 650;\">← Back to OurMoment<\u002Fa><\u002Fp>\n<\u002Fdiv>\n\n\n\n<\u002Fbody><\u002Fhtml>"
